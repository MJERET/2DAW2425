<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Song Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .result img {
            max-width: 100px;
            margin-right: 10px;
        }
        .result h3 {
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Search for a Song</h1>
    <input type="text" id="song-input" placeholder="Enter song name">
    <button id="search-button">Search</button>

    <div id="results"></div>

    <script>
        const clientId = '1bc34a7e42d84c99bca46d93f6988df6';
        const clientSecret = '51d12297782745748c3c1d32e3f55dbf';
        
        async function getAccessToken() {
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Authorization': 'Basic ' + btoa(`${clientId}:${clientSecret}`)
                },
                body: 'grant_type=client_credentials'
            });
            const data = await response.json();
            return data.access_token;
        }

        async function searchSong(query) {
            const token = await getAccessToken();
            const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            const data = await response.json();
            return data.tracks.items;
        }

        function displayResults(tracks) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            tracks.forEach(track => {
                const trackDiv = document.createElement('div');
                trackDiv.classList.add('result');

                const albumImage = track.album.images[0]?.url || '';
                const artists = track.artists.map(artist => artist.name).join(', ');

                trackDiv.innerHTML = `
                    <div>
                        <img src="${albumImage}" alt="Album Art">
                        <div>
                            <h3>${track.name}</h3>
                            <p><strong>Artist(s):</strong> ${artists}</p>
                            <p><strong>Album:</strong> ${track.album.name}</p>
                            <a href="${track.external_urls.spotify}" target="_blank">Listen on Spotify</a>
                        </div>
                    </div>
                `;

                resultsDiv.appendChild(trackDiv);
            });
        }

        document.getElementById('search-button').addEventListener('click', async () => {
            const query = document.getElementById('song-input').value;
            if (!query) {
                alert('Please enter a song name.');
                return;
            }

            const tracks = await searchSong(query);
            displayResults(tracks);
        });
    </script>
</body>
</html>
