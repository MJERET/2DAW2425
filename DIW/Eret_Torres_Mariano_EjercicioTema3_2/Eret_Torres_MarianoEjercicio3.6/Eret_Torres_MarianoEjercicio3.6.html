<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Animación de Texto en Canvas con Sonido y Movimiento Aleatorio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
        }
        #textCanvas {
            border: 1px solid #000;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Animación de Texto con Sonido y Movimiento Aleatorio</h1>
    
    <!-- Caja de texto para ingresar el mensaje -->
    <input type="text" id="textInput" placeholder="Escribe el texto para animar" style="padding: 5px; width: 60%;">
    <button onclick="startAnimation()" style="padding: 10px;">Iniciar Animación</button>
    <br><br>
    <!-- Canvas para la animación -->
    <canvas id="textCanvas" width="500" height="500"></canvas>
    <br>
    <!-- Audio para el sonido de rebote -->
    <audio id="bounceSound" src="boing_lmke36X.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('textCanvas');
        const ctx = canvas.getContext('2d');
        const bounceSound = document.getElementById('bounceSound');
        
        let text = '';
        let xPos = 0;
        let yPos = canvas.height / 2; // Coloca el texto en el centro verticalmente
        let speedX;
        let speedY;
        let animationFrame;

        // Función para iniciar la animación
        function startAnimation() {
            text = document.getElementById('textInput').value || "Texto de ejemplo"; // Obtén el texto o usa texto de ejemplo
            xPos = Math.random() * (canvas.width - ctx.measureText(text).width); // Posición inicial aleatoria en el eje x
            yPos = Math.random() * (canvas.height - 30) + 30; // Posición inicial aleatoria en el eje y
            
            // Velocidad aleatoria y dirección aleatoria para x y y
            speedX = (Math.random() * 2 + 1) * (Math.random() > 0.8 ? 1 : -1); // Velocidad más baja (entre 1 y 3)
            speedY = (Math.random() * 2 + 1) * (Math.random() > 0.8 ? 1 : -1); // Velocidad más baja (entre 1 y 3)

            cancelAnimationFrame(animationFrame); // Cancela cualquier animación anterior
            animateText(); // Comienza la animación
        }

        // Función para animar el texto en el canvas
        function animateText() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Limpia el canvas
            ctx.font = '30px Arial';
            ctx.fillStyle = 'blue';
            ctx.fillText(text, xPos, yPos);

            // Actualiza la posición del texto
            xPos += speedX;
            yPos += speedY;

            // Verifica los bordes para hacer "rebotar" el texto
            if (xPos + ctx.measureText(text).width > canvas.width || xPos < 0) {
                speedX *= -1; // Cambia la dirección en x
                playBounceSound(); // Reproduce el sonido de rebote
            }

            if (yPos > canvas.height || yPos - 30 < 0) { // Ajuste de posición en el eje y
                speedY *= -1; // Cambia la dirección en y
                playBounceSound(); // Reproduce el sonido de rebote
            }

            // Solicita el siguiente cuadro de animación
            animationFrame = requestAnimationFrame(animateText);
        }

        // Función para reproducir el sonido de rebote
        function playBounceSound() {
            bounceSound.currentTime = 0; // Reinicia el audio
            bounceSound.play();
        }
    </script>
</body>
</html>
