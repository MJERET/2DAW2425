        <!-- Está actividad trata de hacer un pagina con bootstrap. -->
        <!-- La cual tiene que seguir el siguiente layout. Tres columnas con otras dos columnas en la central y tres columnas en el pie. -->
        <!-- Sintaxis: -->
        <!-- xs: Móviles. sm: Tablets. md: Pantallas de ordenador pequeñas. lg: Televisiones o pantallas grandes.-->
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <h1 align ="center"><u>Está página usa BootsTrap</u></h1>
        <p align="center"> Se nos pide crear un layout de tres columnas y en la segunda otras dos, y después un pie de página</p>
        <hr size="5" color="black"></hr>
        <div class="container-fluid">
            <div class="row"> 
                <div class ="col-sm-4" align="center"> Columna 1 <br /> col-sm-4 </div>
                
                <div class ="col-sm-4" align="center"> Columna 2 <br /> col-sm-4 <br /> 
                    <div class="row">
                        <div class="col-sm-6" align="center"> Columna 1 <br /> col-sm-6 </div>
                        <div class="col-sm-6" align="center"> Columna 2 <br /> col-sm-6 </div>
                    </div>
                </div>
                
                <div class ="col-sm-4" align="center"> Columna 3 <br /> col-sm-4 <br /> </div>
                <div class="container-fluid"> 
                    <div class="row">
                        <div class ="col-sm-4" align="center"> Pie de página <br /> col-sm-4 </div>
                        <div class ="col-sm-4" align="center"> Pie de página <br /> col-sm-4 </div>
                        <div class ="col-sm-4" align="center"> Pie de página <br /> col-sm-4 </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
