<!DOCTYPE html>
    <head>
        <title> Menu </title>
    </head>
    <body contextmenu="menu-1">
        <header><h1>HTML5 samples: menu</h1></header>
        <section>
            <menu id"menu-1" label="My menu" type="context">
            <menuitem type="command" label="Item 0">Option1</menuitem>
            <menuitem type "command" label="Item 1">Option2</menuitem>
            <menuitem type="command" label="Item2">Option3</menuitem>
            </menu>
        </section>
    </body>
</html>
