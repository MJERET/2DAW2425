<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <title>Ejemplo de jQuery</title>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <style type="text/css">
            
        </style>
    </head>
    <body>
        <!-- Botón para ocultar los elementos de la primera lista -->
        <input type="button" value="Ocultar la primera lista" id="boton1">
        <h2>Lista 1</h2>
        <ul>
            <li id="lista1">Tortilla</li>
            <li>Jamón</li>
            <li>Queso</li>
        </ul>
        <h2>Lista 2</h2>
        <ul>
            <li>Coca Cola</li>
            <li>Leche</li>
            <li>Té</li>
        </ul>
        <script>
            // Esperar a que el documento esté listo
            $(document).ready(function() {
                // Agregar evento click al botón
                $("#boton1").click(function() {
                    // Selecciona y oculta el primer li de la primera lista
                    $("#lista1").hide();
                });
            });
        </script>
</body>
</html>
