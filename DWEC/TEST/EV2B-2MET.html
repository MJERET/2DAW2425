<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro Examen B</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
        }
        input, button {
            margin-bottom: 10px;
            padding: 8px;
        }
        button {
            background-color: #4caf50;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: #ff0000;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Formulario de Registro</h2>
        <form id="formRegistro">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required pattern="^[a-zA-Z]+$">
            <span class="error" id="errorNombre"></span>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
            <span class="error" id="errorEmail"></span>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <span class="error" id="errorPassword"></span>

            <label for="confirmPassword">Confirmar contraseña:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            <span class="error" id="errorConfirmPassword"></span>

            <label for="phone">Número de teléfono:</label>
            <input type="tel" id="phone" name="phone" required pattern="^\d{9}$">
            <span class="error" id="errorPhone"></span>

            <button type="submit">Registrarse</button>
        </form>
        <div id="messages"></div>
    </div>

    <script>
        document.getElementById("formRegistro").addEventListener("submit", function (e) {
            let valido = true;

            if (!validarNombre()) valido = false;
            if (!validarCorreo()) valido = false;
            if (!validarTelefono()) valido = false;
            if (!validarContraseña()) valido = false;
            if (!validarConfirmarContraseña()) valido = false;

            if (valido) {
                alert("Formulario enviado con éxito");
            } else {
                e.preventDefault();
            }
        });

        function validarNombre() {
            let elemento = document.getElementById("nombre");
            let errorSpan = document.getElementById("errorNombre");

            if (!/^[a-zA-Z]+$/.test(elemento.value)) {
                errorSpan.textContent = "El nombre solo puede contener letras y sin espacios.";
                elemento.focus();
                return false;
            }
            errorSpan.textContent = "";
            return true;
        }

        function validarCorreo() {
            let elemento = document.getElementById("email");
            let errorSpan = document.getElementById("errorEmail");

            if (!/^\S+@\S+\.\S+$/.test(elemento.value)) {
                errorSpan.textContent = "Correo electrónico inválido.";
                elemento.focus();
                return false;
            }
            errorSpan.textContent = "";
            return true;
        }

        function validarTelefono() {
            let elemento = document.getElementById("phone");
            let errorSpan = document.getElementById("errorPhone");

            if (!/^\d{9}$/.test(elemento.value)) {
                errorSpan.textContent = "El teléfono debe tener 9 dígitos numéricos.";
                elemento.focus();
                return false;
            }
            errorSpan.textContent = "";
            return true;
        }

        function validarContraseña() {
            let elemento = document.getElementById("password");
            let errorSpan = document.getElementById("errorPassword");

            if (elemento.value.length < 8 || !/[a-z]/.test(elemento.value) || !/[A-Z]/.test(elemento.value) || !/\d/.test(elemento.value)) {
                errorSpan.textContent = "Debe tener al menos 8 caracteres, una mayúscula, una minúscula y un número.";
                elemento.focus();
                return false;
            }
            errorSpan.textContent = "";
            return true;
        }

        function validarConfirmarContraseña() {
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let errorSpan = document.getElementById("errorConfirmPassword");

            if (password !== confirmPassword) {
                errorSpan.textContent = "Las contraseñas no coinciden.";
                document.getElementById("confirmPassword").focus();
                return false;
            }
            errorSpan.textContent = "";
            return true;
        }
    </script>
</body>
</html>
