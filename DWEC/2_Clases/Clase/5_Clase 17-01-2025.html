        /*
          Seleccionar el padre de un elemento con parentElement.
          Acceder a todos los hijos, con .childNodes y .children (SON DISTINTOS)
          Acceder a primero o último hijo con .firstChild o .lastChildren
          Encontrar el siguiente hermano, con nextSibling y nextElementSibling
            <h1></h1> // cuando ponemos este comentario, ya cuenta como otro elemento
          */
        //-----------------------------------------------------------------------
        /*
            - ParentElement. Devuelve el elemento padre del elemento.
            - ParentNode. Salto de linea es un nodo 
            - Children Devuelve la colección con todos los elementos hijo de elemento (sólo elementos HTML, no comentarios ni nodos de tipo texto)
            - ChildNodes Devuelve la colección con todos los hijos de elemento, incluyendo comentarios y nodos de tipo texto por lo que no suele utilizarse.
            - firstElement Child
            - firstChild
            - LastElementChildren...
        */
        //-----------------------------------------------------------------------
        /*
        Cuando le de click a galicia tiene que salir un mensaje que diga que es una provincia que está en el sur y tiene 
        las siguientes ciudades
        */
        window.onload=inicio;

        function inicio() {
            var longitud = document.getElementsByTagName("h2").length;
            for (var i=0; i<longitud; i++){
                //document.getElementsByTagName("h2")[i].addEventListener("click", recorrerAdelante);
                document.getElementsByTagName("h2")[i].addEventListener("click", recorrerAtras);
                document.getElementById("boton").addEventListener("click", punto);
                document.getElementById("boton2").addEventListener("click", ponerpunto);
            }
            

        }

        /*Este ejercicio pero al reves, con el orden de: ul*/
        function recorrerAtras(e) {
            var texto = "";
            var h2 = e.target;
            texto += "Has elegido " +h2.textContent + " ";
            var padre = h2.parentElement;
            texto += "que está situado " +padre.id + "<br/>";
            var ul = h2.nextElementSibling;
            texto += "El número de provincias es " + ul.children.length + " ";
            //Miramos elemento ul hacia atras:
            var hijo = ul.lastElementChild;
            while (hijo != null) {
                texto += "" + hijo.textContent + " ";
                hijo = hijo.previousElementSibling;
            }
            document.getElementById("texto").innerHTML = texto;
        }
        function punto() {
            console.log("A");
            var li = document.getElementsByTagName("li");
            for (var i = 0; i < li.length; i++) {
                li[i].textContent += ".";
            }
        
        let puntoAdded = false;
        function ponerpunto() {
            let bloque = document.getElementById("div");
            let parrafos = bloque.children;
            if(!puntoAdded) {
                for (let i=0; i<parrafos.length ;i++) {
                    if (parrafos[i].tagName=="p"){
                        parrafos[i].innerHTML += ".";
                    } //if
                } // for
            } // if
        } //ponerPunto
            puntoAdded=true;
        }
