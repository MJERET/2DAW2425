        <h3> Recorrido de un array. </h3>
        <p id="escribe"> </p>
        <p id="escribe2"> </p>
        <script>
            //Crecación de la variable.
            let text="";
            let text2="";
            let text3="";
            let text4="";
            var dias=['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
            dias.forEach(mostrar);
            //Eficiente.
            function mostrar(valor, index, array) {
                text=text+valor+" ";
            }
            //No es eficiente.
            /*for (var i = 0; i < dias.length ; i++) {  text2=text2+dias[i]+"--"; }
            /*let longitud=dias.length; for (var i = 0; i < longitud; i ++) {    //....    }*/
            /*for (var i = 0, longitud=dias.length; i < longitud; i++) {    text2=text2+dias[i]+"||";   } */

            //Es eficiente
            for (var i = 0; longitud=dias.length, i<longitud; i++) {
                text2=text2+dias[i]+"||";
            }
            // For in. 
            for (let i in dias) {
                text3=text3+dias[i]+"##"
            }
            // For of
            for (let i of dias) {
                text4=text4+i+"=";
            }

            try {

            }

                console.log(e.name+':'+e.message)
            }




            //Mostrar la variable txt
            document.getElementById("escribe").innerHTML = "Frase introducida: " + text + "</br>";
            document.getElementById("escribe").innerHTML += "</br> Frase introducida: " + text2;
            document.getElementById("escribe").innerHTML += "</br> Frase introducida: " + text3;
            document.getElementById("escribe").innerHTML += "</br> Frase introducida: " + text4;
