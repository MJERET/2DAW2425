            /*

                En entornos modernos, es preferible usar Object.getPrototypeOf(obj) para acceder al prototipo de un objeto.

                JS busca en el prototipo al que apunta juan.__proto__. Este proceso se repite hacia arriba en la cadena de prototipos
                hasta llegar al prototipo raíz (Object.prototype), o hasta que no haya más prototipos (cuyo caso devuelve undefiend)
            
                __proto__ 
                    - Propiedad de instancia de objetos.
                    - Apunta al prototipo del objeto.
                    - No se define explicitamente, es automatico.
                    
                prototype.
                    - Propiedad de funciones constructoras.
                    - Se usa como prototipo de las instancias new.  
                    - Se define al crear una funcion constructora.

            */

                    }
