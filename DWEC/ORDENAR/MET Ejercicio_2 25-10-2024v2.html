<!DOCTYPE html>
    <head>

    </head>
    <body>
        <h1 align="center"> Número de palabras</h1>
        <p align="center" id="demo"></p>
        <p align="center" id="frase"> </p>
        <hr></hr>
        <br><br>
        <h1 align="center"> Frases ordenadas </h1>
        <p id="fraseOrdenada" align="center"> </p>
        <p id="fraseOrdenada2" align="center"> </p>
        <script>
            /*
            Solicitar una frase desde teclado, almacenar cada palabra en un elemento de un array y mostrar los siguientes datos:
                - La primera palabra de la frase.
                - La última palabra de la frase.
                - El número de palabras en la frase.
            
            //Cambios: Preguntar por una siguiente frase despues de haber mostrado la primera, como también mostrar todas las palabras ademas de las ya introducidas. 
            //Ordenar alfabeticamente el orden de las palabras Hacer uso del sort.
            */

            //Variables globales
            let todaslasfrases = [];
            let todaslaspalabras = 0;
            
            function pregunta() {
            let question = prompt("¿Quieres introducir una frase? (si o no)");
    
            while (question === "si") {
                let fraseArray = user();  // Llama a la función para obtener el array de la frase
                
                todaslasfrases = todaslasfrases.concat(fraseArray);  // Agrega las palabras de la frase actual al historial
                todaslaspalabras += fraseArray.length;  // Suma la cantidad de palabras de la frase actual
                
                mostrarDatos(fraseArray);  // Muestra los datos de la frase actual y el total acumulado
                orden();                   // Ordena las palabras alfabéticamente
                // Pregunta si quiere introducir otra frase
                if (pregunta2() !== "si") {
                    alert("Hasta luego");
                    break;  // Salir del bucle si no quiere introducir otra frase
                }
            }
        alert("Hasta luego");
        }

        function pregunta2() {
            return prompt("¿Quieres introducir otra frase? (si o no)");
        }

        function orden () {
            todaslasfrases.sort();
            console.log(todaslasfrases);
            document.getElementById("fraseOrdenada").innerHTML = "Frase introducida " + todaslasfrases;
            document.getElementById("fraseOrdenada2").innerHTML = "Frase ordenada alfabéticamente " + todaslasfrases;
        }

            function user () {  //
                // let frase = String(prompt("Introduce una frase")); Si solo queremos frases con texto y no con números. 
                let usuario = String(prompt("Introduce una frase"));
                let frase = usuario.split(" ");
                return frase;
            }   // user
            
            function mostrarDatos(fraseArray) {
                console.log("Primera palabra: " + fraseArray[0]);
                console.log("Ultima palabra: " + fraseArray[fraseArray.length - 1]);
                console.log("Número de palabras: " + fraseArray.length);
                console.log(fraseArray);
                //Imprimimos fuera del html
                document.getElementById("demo").innerHTML = "Número de palabras en la frase: " + todaslaspalabras.length;
                document.getElementById("frase").innerHTML = "Frase introducida " + todaslasfrases;
            }
            pregunta();
            //Función para preguntar al usuario si quiere introducir otra frase más.
 
            


            

        </script>
    </body>
</DOCTYPE>
